<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fabBoard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F07C1F'/%3E%3C/svg%3E">
<link href="schriften/schriften.css" rel="stylesheet">
<style>
/* Layout: Label-Spalte links, Inhalt rechts; Projekte als Tabs, Themen als nummerierte Abschnitte */
:root{--bg:#FCFCFA;--ink:#1A1A1A;--text2:#4A4A45;--muted:#6B6B66;--num:#66665F;--line:#E6E6E3;--field:#F4F4F1;--kfield:#EEEEEA;--card:#FFFFFF;--accent:#3E5C76;--mark:#E8EEF3;--onink:#FFFFFF;--toastlink:#BFD0DE;--hover:#333333;--err:#B3261E;--serif:'Source Serif 4',Georgia,serif;--sans:Inter,system-ui,sans-serif;--lab:130px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--ink:#ECECE8;--text2:#C4C4BE;--muted:#9A9A94;--num:#8F8F89;--line:#2E3032;--field:#1F2123;--kfield:#1F2123;--card:#191B1C;--accent:#8FB0CC;--mark:#22313D;--onink:#141516;--toastlink:#3E5C76;--hover:#D0D0CB;--err:#F2B8B5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--ink:#ECECE8;--text2:#C4C4BE;--muted:#9A9A94;--num:#8F8F89;--line:#2E3032;--field:#1F2123;--kfield:#1F2123;--card:#191B1C;--accent:#8FB0CC;--mark:#22313D;--onink:#141516;--toastlink:#3E5C76;--hover:#D0D0CB;--err:#F2B8B5;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
.cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kopf{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;padding:14px 0 10px;border-bottom:1px solid var(--ink)}
/* Wortmarke nach fabBoard-Brandbook: Inter Tight 900, oranger Schlusspunkt 1,5-fach auf der Grundlinie */
.marke{font:900 26px/1 'Inter Tight',var(--sans);letter-spacing:-.03em;cursor:pointer}
.marke .pkt{color:#F07C1F;font-size:1.5em;line-height:0;letter-spacing:0}
.mk{display:flex;align-items:baseline;gap:8px}
.ver{font-size:11px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
/* Logo und Projekt-Tabs bleiben oben stehen, alles ab dem Projektbereich scrollt darunter */
.oben{position:sticky;top:0;z-index:5;background:var(--bg)}
html{scroll-padding-top:110px}
.tabs{display:flex;flex-wrap:wrap;gap:0 22px;border-bottom:10px solid var(--bg);align-items:center}
.tab{display:flex;align-items:baseline;gap:8px;min-height:40px;padding:9px 0 7px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font:600 16px var(--serif);color:var(--muted)}
.tab.an{color:var(--ink);border-bottom-color:#F07C1F}
.tab small{font:500 12px var(--sans);color:var(--muted)}
.tab.plus{font:500 13px var(--sans);margin-left:auto}
/* Handy: nur das aktive Projekt mit Zahl offener Punkte, die übrigen Projekte klappen darunter auf */
.tabwahl{display:none}
@media (max-width:760px){.tabs{flex-direction:column;flex-wrap:nowrap;align-items:stretch}.tabs .tab{display:none}.tabs.auf .tab{display:flex}.tabs.auf .tab small{margin-left:auto}.tab.plus{margin-left:0}
  .tabwahl{display:flex;align-items:baseline;gap:8px;min-height:44px;padding:9px 0 7px;background:none;border:0;border-bottom:2px solid #F07C1F;cursor:pointer;font:600 16px var(--serif);color:var(--ink);text-align:left}
  .tabwahl small{font:500 12px var(--sans);color:var(--muted)}.tabwahl .pf{margin-left:auto;font:500 13px var(--sans);color:var(--muted)}}
.held{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 28px;padding:10px 0 8px;border-bottom:1px solid var(--ink)}
.held h1{flex:1 1 300px;min-width:0;margin:0;font:600 27px/1.1 var(--serif);letter-spacing:-.02em;text-wrap:balance}
.kz{flex:0 0 auto;margin-left:auto;display:grid;grid-template-columns:repeat(3,auto);border-left:1px solid var(--line);padding-left:12px}
.kz button{all:unset;cursor:pointer;text-align:center;padding:6px 8px 0 0;border-right:1px solid var(--line)}
.kz button+button{padding-left:8px}
.kz button:last-child{border-right:0}
.kz button:focus-visible{outline:2px solid var(--accent)}
.kz b{display:block;font:600 22px/1 var(--serif);font-variant-numeric:tabular-nums}
.kz button.an b{color:var(--accent)}
.kz span{display:block;margin-top:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ab{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);gap:0 20px;padding:8px 0 4px;border-bottom:1px solid var(--ink)}
.ab>.l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:6px}
.ab>.l .nr{color:var(--num)}
.ab>.l .z{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.ab>.l .w{display:flex;gap:10px;margin-top:3px}
.ab>div{min-width:0}
.leer{margin:5px 0;color:var(--muted);font-size:13px}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;padding:6px 0 7px;border-bottom:1px solid var(--line);align-items:start}
.zeile>div{min-width:0}
.zeile.neu-mark{animation:mark 1.4s}
@keyframes mark{from{background:var(--mark)}to{background:transparent}}
.meta{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meta .t{color:var(--ink)}
.meta .c{color:var(--accent)}
.zeile h2{margin:0;font:600 15px/1.3 var(--serif)}
.zeile .tx{margin:1px 0 0;max-width:680px;font-size:13px;line-height:1.5;color:var(--text2);white-space:pre-wrap}
.opts{display:flex;flex-wrap:wrap;gap:0 16px;margin-top:2px}
.opt{display:flex;align-items:flex-start;gap:7px;min-height:26px;padding:3px 0;background:none;border:0;cursor:pointer;text-align:left;font-size:13px;line-height:1.45}
.opt i{flex:0 0 auto;width:14px;height:14px;margin-top:3px;border:1.5px solid var(--ink);border-radius:50%;box-shadow:inset 0 0 0 3px var(--card);background:var(--card)}
.opt.multi i{border-radius:3px}
.opt.an i{background:var(--ink)}
.opt em{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.akt{display:flex;gap:14px;margin-top:1px;opacity:0;transition:opacity .2s}
.zeile:hover .akt,.zeile:focus-within .akt{opacity:1}
.lk{background:none;border:0;padding:2px 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lk:hover{color:var(--ink)}
.lk.imp{font-size:12px;letter-spacing:0;text-transform:none}
dialog .imp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:4px 0;font-size:14px}
dialog .imp dt{color:var(--muted)}
dialog .imp dd{margin:0}
dialog .imp p{margin:0;font-size:12px;color:var(--muted)}
dialog .imp a{color:var(--accent)}
dialog .imp p.copy{margin:2px 0 10px;font-size:13px;color:var(--text2)}
/* Haftungshinweis: deutlich abgesetzter Kasten (entschieden 2026-11-09), schwarzer Rand statt Orange */
.wichtig{border:2px solid var(--ink);border-radius:8px;background:var(--field);padding:10px 14px}
.wichtig h3{margin:0 0 4px;font:600 15px/1.3 var(--serif);color:var(--ink)}
.wichtig ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--text2)}
.wichtig li,.ew .wichtig li{display:list-item;margin:2px 0;padding:0;border:0;border-radius:0;background:none}
.f label.ok{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.f label.ok input{width:auto;margin:2px 0 0;accent-color:var(--ink)}
.f details.dsein{margin:8px 0;font-size:13px}
.f details.dsein summary{cursor:pointer;text-decoration:underline;font-weight:600}
.f details.dsein[open]{max-height:220px;overflow:auto;border:1px solid var(--line,rgba(128,128,128,.35));padding:8px 12px;border-radius:6px}
.f details.dsein h3{font-size:13px;margin:10px 0 2px}
.f details.dsein p{margin:0 0 6px}
dialog .imp h3{margin:12px 0 4px;font:600 15px/1.3 var(--serif)}
dialog .ds p{margin:0 0 4px;font-size:13px;line-height:1.55;color:var(--text2)}
.rechts{min-width:0}
textarea.kom{width:100%;min-height:34px;border:1px solid var(--line);border-radius:6px;background:var(--kfield);padding:5px 8px;font:12.5px/1.4 var(--sans);resize:vertical;vertical-align:top}
.plusp{display:block;background:none;border:0;padding:5px 0 4px;font-size:12.5px;color:var(--muted);cursor:pointer}
.plusp:hover{color:var(--ink)}
.neu{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:end;margin:6px 0 4px}
.neu select,.neu input,.f input,.f select,.f textarea{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:5px 2px;font:13px var(--sans);border-radius:0;width:100%}
.neu input:focus,.neu select:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-bottom:2px solid var(--accent)}
.btn{min-height:34px;padding:0 14px;border:0;border-radius:6px;background:var(--ink);color:var(--onink);font:500 13px var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.hell{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.hell:hover{background:var(--field)}
.btn:disabled{opacity:.5;cursor:default}
.f{display:grid;gap:8px;padding:10px 12px;background:var(--field);border-radius:8px;margin:8px 0;grid-column:1/-1}
.f label{display:grid;gap:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f label[hidden]{display:none}
.f .r{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.f .zwei{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.arch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:6px 0;border-bottom:1px solid var(--line);align-items:start}
.arch>div{min-width:0}
.arch h3{margin:1px 0 0;font:600 15px/1.3 var(--serif)}
.arch .an{margin-top:1px;font-size:13px}
.k{margin-top:3px;padding:4px 8px;border-radius:6px;background:var(--field);font-size:12.5px;white-space:pre-wrap}
.arch .b,.msg .b{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.arch .ak{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.btn.klein{min-height:26px;padding:0 10px;font-size:12px}
.arch .adel{opacity:0;transition:opacity .2s}
.arch:hover .adel,.arch:focus-within .adel{opacity:1}
.badge{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.w{border-color:var(--accent);color:var(--accent)}
.post textarea{display:block;margin:0 0 6px;width:100%;min-height:56px;border:1px solid var(--line);border-radius:6px;background:var(--kfield);padding:7px 10px;font:13px/1.45 var(--sans);resize:vertical}
.post textarea:focus{outline:0;border-color:var(--accent)}
.msg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:5px 0;border-bottom:1px solid var(--line);align-items:start}
.msg>div{min-width:0}
.msg .tx{margin:1px 0 0;font-size:13px;line-height:1.5;color:var(--text2);white-space:pre-wrap}
.msg.erl .tx{color:var(--muted)}
.wrap{padding-bottom:72px}
/* Fußzeile fest am unteren Fensterrand (entschieden 2026-11-06), Inhalt scrollt darunter; links Impressum, Ko-fi etwas links der Mitte (rechte Spalte breiter), rechts Newsletter (entschieden 2026-11-06) */
.fuss{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.fuss .fi{display:grid;grid-template-columns:1fr auto 1.35fr;align-items:center;gap:12px;max-width:1160px;margin:0 auto;padding:9px max(16px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
@media (min-width:900px){.fuss .fi{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
.fuss .re{display:flex;justify-content:flex-end}
/* Ko-fi: Tasse schwarz (Hell) bzw. weiß (Dunkel) mit Herz im Ko-fi-Rot (bewusste Ausnahme vom Brandbook, entschieden 2026-11-06), Text wie die Fußzeile */
.kaffee{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;white-space:nowrap}
.kaffee svg{width:20px;height:20px;fill:var(--ink);flex:none}
.kaffee:hover span{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.kaffee span{display:none}}
.fuss .imp{text-decoration:none}
/* Newsletter: vorerst Attrappe (2026-11-06, wird später aktiviert); nichts wird gespeichert oder gesendet */
.news{display:flex;align-items:center;gap:6px;margin:0}
@media (max-width:900px){.news{display:none}}
.fuss .imp:hover{color:var(--accent)}
.toast{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:16px;align-items:center;max-width:min(520px,calc(100% - 40px));padding:12px 16px;border-radius:8px;background:var(--ink);color:var(--onink);font-size:13px}
.hoch{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;width:40px;height:40px;border:0;border-radius:50%;background:var(--ink);color:var(--onink);font-size:18px;line-height:1;cursor:pointer}
.hoch:hover{background:var(--hover)}
.hoch[hidden]{display:none}
.toast button{background:none;border:0;color:var(--toastlink);cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
dialog{border:0;border-radius:10px;padding:0;width:min(560px,calc(100% - 28px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,20,.35)}
dialog .f{margin:0;background:var(--card);padding:20px}
dialog h2{margin:0 0 4px;font:600 26px var(--serif)}
.hinweis{max-width:720px;padding:60px 0}
.hinweis h1{font:600 40px var(--serif);margin:0 0 12px}
@media (max-width:760px){.ab{grid-template-columns:1fr}.zeile{grid-template-columns:1fr}.neu{grid-template-columns:1fr}.kz{flex-basis:100%;border-left:0;padding-left:0;border-top:1px solid var(--line)}.akt,.arch .adel{opacity:1}.held h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Start-Knopf der KI („Claude starten“, „Codex starten“ …) sitzt im festen Kopf rechts und bleibt beim Scrollen erreichbar */
.kr{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 16px}
.lauf{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 8px;font-size:12px;color:var(--muted)}
.lauf .btn{min-height:30px;padding:0 12px;font-size:12.5px}
.lauf .an{color:var(--accent)}
.lauf .kiwahl{display:inline-flex;align-items:center;gap:6px}
.lauf .kiwahl .pf{color:var(--muted);font-size:11px}
.lauf .kiallein{display:inline-flex;align-items:center;color:var(--ink)}
.kilogo{width:15px;height:15px;flex:0 0 auto;fill:currentColor}
.kilogo.bst{display:inline-flex;align-items:center;justify-content:center;border:1.4px solid currentColor;border-radius:50%;font-size:9px;font-weight:700;line-height:1;box-sizing:border-box}
/* Start-Knopf mit grünem Rahmen und grüner Schrift, solange die KI nicht arbeitet; im Dunkelmodus helleres Grün */
.btn.start{background:transparent;color:#2E8B57;border:1.5px solid #2E8B57}
.btn.start:hover{background:#EAF4EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.start{color:#5DBB85;border-color:#5DBB85}:root:not([data-theme="light"]) .btn.start:hover{background:#1C2A22}}
:root[data-theme="dark"] .btn.start{color:#5DBB85;border-color:#5DBB85}
:root[data-theme="dark"] .btn.start:hover{background:#1C2A22}
/* Während eines Laufs zeigt der Knopf nur orangen Rahmen und Schrift mit pulsierendem orangem Schein, wie der Punkt im Projekt-Tab (bei „Bewegung reduzieren“ ruhig) */
.btn.puls,.btn.puls:disabled,:root .btn.start.puls{background:transparent;color:#F07C1F;border-color:#F07C1F;opacity:1;animation:puls 1.6s ease-in-out infinite}
.lp{display:inline-block;width:8px;height:8px;border-radius:50%;background:#F07C1F;align-self:center;animation:puls 1.6s ease-in-out infinite}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(240,124,31,.7)}70%{box-shadow:0 0 0 9px rgba(240,124,31,0)}100%{box-shadow:0 0 0 0 rgba(240,124,31,0)}}
.lauf .err{color:var(--err)}
/* Kopf rechts: nur bei Fehler roter Punkt + Text direkt links neben dem Knopf */
.zst{display:flex;align-items:center;gap:7px;white-space:nowrap}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2E8B57}
.pt.an{background:#F07C1F;animation:puls 1.6s ease-in-out infinite}
.pt.err{background:var(--err)}
/* Einrichtungs-Assistent: KI wählen, prüfen, Nutzungsbedingungen */
dialog.ew{width:min(620px,calc(100% - 28px))}
.ew .schritt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ew p{margin:0;font-size:13px;line-height:1.5;color:var(--text2)}
.ew .gr{margin:10px 0 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ew label.wahl{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.ew label.wahl:has(input:checked){border-color:var(--accent);background:var(--mark)}
.ew label.wahl input{width:auto;margin:3px 0 0;accent-color:var(--accent)}
.ew label.wahl small{display:block;color:var(--muted);font-size:12px}
.ew ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.ew li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
/* Brandbook: erledigt = Akzent (Blaugrau), offen = Kreis in Tinte; Orange bleibt Logo/„arbeitet“, Grün dem Start-Knopf */
.ew li .ic{width:20px;height:20px;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--onink);background:var(--accent)}
.ew li.nein .ic{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.ew li b{font-size:13px}
.ew .cmd{display:flex;gap:8px;align-items:center;margin:6px 0 0}
.ew code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;padding:5px 8px;border-radius:6px;background:var(--kfield);font:12px ui-monospace,Consolas,monospace}
.ew a{color:var(--accent);font-size:13px}
.ew .warte{color:var(--muted);font-size:13px}
.ew .fehl{color:var(--err);font-size:13px}
.ew .stand{margin-top:6px;font-size:13px;color:var(--text2)}
.ew .stand:empty{display:none}
.ew .stand.fehl{color:var(--err)}
.ew ul.punkte{margin:8px 0 2px;padding-left:18px;font-size:13px;line-height:1.6;color:var(--text2)}
.ew ul.punkte li{display:list-item;padding:0;border:0;border-radius:0;background:none}
.ew h2.gross{font-size:24px}
.ew h2.gross .marke{font-size:1.1em;cursor:default}
/* Kurze Tour: dunkle Fläche mit Ausschnitt um das gezeigte Element, Karte mit Text daneben */
.tour{position:fixed;inset:0;z-index:20}
.tour .tring{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);outline:2px solid var(--accent);outline-offset:0;transition:all .2s ease;pointer-events:none}
.tour .tkarte{position:fixed;width:min(320px,calc(100% - 16px));padding:12px 14px;border-radius:10px;background:var(--card);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.tour .tkarte p{margin:4px 0 12px;font-size:13px;line-height:1.5;color:var(--text2)}
.tour .tkarte .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ew .stand small{display:block;margin-top:2px;color:var(--muted);font:12px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.ew details.selbst{margin-top:8px}
.ew details.selbst summary{cursor:pointer;font-size:12px;color:var(--muted)}
.ew details.selbst p{margin-top:6px}
.kr .lk{font-size:11px}
.lk.zahnrad{display:inline-flex;align-items:center;padding:3px;border-radius:6px;text-decoration:none}
.lk.zahnrad svg{width:16px;height:16px;display:block}
.lk.zahnrad.an{background:var(--mark);color:var(--accent)}
/* Einstellungen: großer Dialog in der Mitte mit Reitern links, Board dahinter abgedunkelt (entschieden 2026-11-09); Klick auf den Schleier, × oder Esc schließt */
.einst{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(20,20,20,.35)}
.einst[hidden]{display:none}
.einst .edlg{width:min(760px,calc(100% - 28px));height:min(560px,calc(100% - 40px));display:grid;grid-template-columns:180px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);background:var(--card);color:var(--ink);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.einst .ek{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:16px 22px 12px;border-bottom:1px solid var(--line)}
.einst h2{margin:0;font:600 22px var(--serif)}
.einst .x{background:none;border:0;padding:2px 4px;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
.einst .x:hover{color:var(--ink)}
.einst .reiter{display:flex;flex-direction:column;padding:10px 0;border-right:1px solid var(--line);min-height:0;overflow-y:auto}
.einst .reiter button{background:none;border:0;border-left:2px solid transparent;padding:8px 20px;font-size:13.5px;color:var(--text2);cursor:pointer;text-align:left}
.einst .reiter button:hover{color:var(--ink);background:var(--field)}
.einst .reiter button.an{color:var(--ink);font-weight:600;border-left-color:var(--ink);background:var(--mark)}
.einst .reiter .ver{margin-top:auto;padding:8px 20px 0}
.einst .inhalt{min-height:0;overflow-y:auto;padding:16px 26px 24px}
.einst h3{margin:0 0 4px;font:600 18px var(--serif)}
.einst .grp{margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
.einst .cap{font-size:11px;margin-bottom:2px}
.einst .a{display:inline-block;background:none;border:0;padding:3px 0;margin-right:18px;font-size:13px;color:var(--accent);cursor:pointer;text-align:left;text-decoration:none}
.einst .a:hover{text-decoration:underline;text-underline-offset:3px}
.einst .a.rot{color:var(--err)}
.einst .zl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.einst .zl>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.einst .zl .w{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.einst .zl .lks{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.einst .zl .lk{font-size:10px}
.einst .zl.an>span:first-child{font-weight:600}
.einst .zl small{color:var(--muted);font-size:12px;flex:0 0 auto}
.einst ul.feat{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--text2)}
.einst ul.feat li{margin:3px 0}
.einst dl.tech{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px;margin:8px 0 0;font-size:13px}
.einst dl.tech dt{color:var(--muted)}
.einst dl.tech dd{margin:0;color:var(--text2)}
/* Handy: Dialog füllt den Bildschirm, Reiter oben als waagrechte Leiste */
@media (max-width:760px){.einst .edlg{width:100%;height:100%;border-radius:0;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .einst .ek{padding-top:max(16px,env(safe-area-inset-top,0px))}
  .einst .reiter{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 8px;border-right:0;border-bottom:1px solid var(--line)}
  .einst .reiter button{flex:0 0 auto;padding:10px 12px;border-left:0;border-bottom:2px solid transparent}
  .einst .reiter button.an{border-bottom-color:var(--ink);background:none}
  .einst .reiter .ver{display:none}
  .einst .inhalt{padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}}
/* Läufe-Dialog: Verlauf als Tabelle, Protokoll als Text mit eigenem Rollbalken */
dialog .prot{max-width:760px}
dialog .prot table{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 8px}
dialog .prot th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
dialog .prot td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
dialog .prot td.err{color:var(--err)}
dialog .prot td.an{color:var(--accent)}
dialog .prot h3{margin:14px 0 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dialog .prot pre{margin:0;max-height:38vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,Consolas,monospace;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink)}
/* Suche (Strg+K) */
dialog .suche{min-width:min(560px,90vw)}
dialog .suche input{width:100%;box-sizing:border-box;font-size:15px}
dialog .suche .treffer{margin-top:8px;max-height:55vh;overflow:auto}
dialog .suche .tr{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 4px;cursor:pointer;color:var(--ink);font:inherit}
dialog .suche .tr:hover,dialog .suche .tr:focus{background:var(--mark);outline:none}
dialog .suche .tr small{display:block;color:var(--muted);font-size:11px}
dialog .suche .leer{color:var(--muted);font-size:13px;margin:6px 0}
.lauf .ordnerlk{font-size:12px;letter-spacing:0;text-transform:none}
.einst .hw{margin:6px 0 4px;font-size:12.5px;color:var(--muted);line-height:1.45;max-width:560px}
.sw{display:inline-flex;flex:0 0 auto;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sw button{background:none;border:0;padding:2px 8px;font-size:12px;color:var(--ink);cursor:pointer}
.sw button+button{border-left:1px solid var(--line)}
.sw button.an{background:var(--mark);color:var(--accent)}
.ew label.spr{max-width:240px;margin:4px 0 2px}
</style>
</head>

<button class="hoch" id="hoch" hidden>↑</button>
<div class="einst" id="einst" hidden></div>
<dialog id="dlg"></dialog>

<script src="texte.js"></script>
<script>
'use strict';
const S = { frisch: new Set(), projekte: {}, mtime: {}, aktiv: null, filter: 'alle', dirty: new Set(), bearbeiten: null, markiert: null, archivAuf: {}, themaZu: {}, archivStand: {}, auszulagern: {}, archivAlt: false, name: 'mich' };
try { const v = JSON.parse(localStorage.getItem('fabboard') || '{}'); S.aktiv = v.aktiv || null; S.filter = ['fabian', 'claude'].includes(v.filter) ? v.filter : 'alle'; S.archivAuf = v.archivAuf || {}; S.themaZu = v.themaZu || {}; } catch (e) {}
try { const h = localStorage.getItem('fabboard-hell'); if (h === 'light' || h === 'dark') document.documentElement.dataset.theme = h; } catch (e) {}
const merken = () => { try { localStorage.setItem('fabboard', JSON.stringify({ aktiv: S.aktiv, filter: S.filter, archivAuf: S.archivAuf, themaZu: S.themaZu })); } catch (e) {} };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ortszeit = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16).replace('T', ' '); };
const heute = () => ortszeit().slice(0, 10);
const datum = (d) => { if (!d) return ''; const [y, m, t] = d.slice(0, 10).split('-'); return sprache() === 'de' ? `${t}.${m}.${y}` : `${y}-${m}-${t}`; };
const nid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const slug = (s) => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'projekt';
const liste = () => Object.values(S.projekte).sort((a, b) => (a.reihenfolge ?? 99) - (b.reihenfolge ?? 99));
// Anzeigenamen der Eintragsarten; „Frage an …“ nennt die gewählte KI (gespeichert wird weiter frage-an-claude)
const TYPEN = () => ({ 'frage': T('typFrage'), 'frage-an-claude': T('typFrageAn', { ki: kiName() }), 'anweisung': T('typAnweisung'), 'idee': T('typIdee'), 'aufgabe': T('typAufgabe'), 'info': T('typInfo') });
const SPAETER = 'spaeter';

function zaehle(p) {
  const z = { fabian: 0, claude: 0, offen: 0, wartet: 0 };
  for (const t of p.themen) for (const it of t.items) { z.offen++; if (it.wer === 'claude') z.claude++; else z.fabian++; }
  // Archiv-Punkte mit „Rückfrage gestellt“ warten auf eine neue Antwort des Nutzers, nicht auf die KI (entschieden 2026-11-06)
  z.wartet = (p.archiv || []).filter((a) => a.umgesetzt === false && !/^(Rückfrage|Follow-up)/i.test(a.ergebnis || '')).length;
  return z;
}

// ---------- Speichern
async function laden() {
  const r = await fetch('api/alles', { cache: 'no-store' }); if (!r.ok) throw new Error('Server');
  const d = await r.json(); S.projekte = {}; S.mtime = {};
  for (const p of d.projekte) {
    const { _mtime, _archivDatei, ...rest } = p; rest.themen ||= []; rest.archiv ||= [];
    // Erledigtes Archiv steht in <id>.archiv.json; im Board ein gemeinsames Archiv (bei doppelter ID gilt die Hauptdatei)
    if (rest.archiv.some((x) => x.umgesetzt !== false)) S.auszulagern[rest.id] = true;
    const datei = _archivDatei?.archiv || []; const ids = new Set(rest.archiv.map((x) => x.id));
    rest.archiv = [...rest.archiv, ...datei.filter((x) => !ids.has(x.id))];
    // Regel: Ein leeres Thema wird gelöscht (auch „Allgemein“); neue Aufträge legen neue Themen an. Gerade angelegte Themen bleiben,
    // bis der erste Punkt darin steht (S.frisch); beim nächsten Speichern verschwinden leere Themen aus der Datei.
    rest.themen = rest.themen.filter((t) => t.items.length || S.frisch.has(rest.id + '/' + t.id));
    S.projekte[rest.id] = rest; S.mtime[rest.id] = _mtime; S.archivStand[rest.id] = JSON.stringify(datei);
  }
  if (!S.projekte[S.aktiv]) S.aktiv = liste()[0]?.id || null;
}
// Erledigte Einträge, die noch in der Hauptdatei stehen, auslagern – aber nicht, solange Claude an dem Projekt arbeitet
function auslagern() { for (const id of Object.keys(S.auszulagern)) if (S.projekte[id] && !S.lauf?.[id]?.laeuft) { delete S.auszulagern[id]; geaendert(id); } }
let timer = null;
function geaendert(id) { S.dirty.add(id); clearTimeout(timer); timer = setTimeout(speichern, 450); }
async function speichern() {
  try {
    for (const id of [...S.dirty]) {
      const p = S.projekte[id]; S.dirty.delete(id); if (!p) continue;
      p.geaendert = ortszeit();
      // Erst das erledigte Archiv schreiben, dann die Hauptdatei nur mit den offenen Archiv-Einträgen (umgesetzt: false)
      let haupt = p;
      if (!S.archivAlt) {
        const erl = p.archiv.filter((x) => x.umgesetzt !== false); const s = JSON.stringify(erl);
        let ok = true;
        if (s !== (S.archivStand[id] ?? '[]')) {
          const ra = await fetch('api/archiv/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, archiv: erl }, null, 1) });
          if (ra.status === 404) { S.archivAlt = true; ok = false; } else if (!ra.ok) throw new Error(ra.status); else S.archivStand[id] = s;
        }
        if (ok) haupt = { ...p, archiv: p.archiv.filter((x) => x.umgesetzt === false) };
      }
      const q = S.mtime[id] != null ? '?mtime=' + S.mtime[id] : '';
      const r = await fetch('api/projekte/' + id + q, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(haupt, null, 1) });
      const j = await r.json();
      if (r.status === 409) { await neuLaden(); toast(T('konflikt', { name: p.name })); continue; }
      if (!r.ok) throw new Error(j.fehler || r.status);
      S.mtime[id] = j.mtime;
    }
  } catch (e) { toast(T('nichtGespeichert')); }
}
async function neuLaden() { await laden(); render(); auslagern(); }
async function abgleich() {
  if (S.dirty.size) return;
  const a = document.activeElement; if (a && /TEXTAREA|INPUT|SELECT/.test(a.tagName) || $('#dlg').open) return;
  try {
    const st = await (await fetch('api/stand', { cache: 'no-store' })).json();
    const ids = Object.keys(st);
    const neu = ids.length !== Object.keys(S.projekte).length || ids.some((id) => Math.abs((S.mtime[id] || 0) - st[id]) > 1);
    if (neu) { await neuLaden(); toast(T('neuerStand')); }
  } catch (e) {}
}

// ---------- Darstellung
function render() {
  merken();
  const p = S.projekte[S.aktiv];
  const lp = (id) => S.lauf?.[id]?.laeuft ? `<span class="lp" title="${esc(T('kiArbeitet', { ki: kiName(S.projekte[id]) }))}" aria-label="${esc(T('kiArbeitet', { ki: kiName(S.projekte[id]) }))}"></span>` : '';
  $('#tabs').classList.toggle('auf', !!S.tabsAuf);
  $('#tabs').innerHTML = (p ? `<button class="tabwahl" data-a="tabs-auf" aria-expanded="${S.tabsAuf ? 'true' : 'false'}">${lp(p.id)}${esc(p.name)}<small>${T('offenN', { n: zaehle(p).offen })}</small><span class="pf" aria-hidden="true">${S.tabsAuf ? '▴' : '▾'}</span></button>` : '')
    + liste().map((x) => `<button class="tab${x.id === S.aktiv ? ' an' : ''}" data-tab="${x.id}" ${x.id === S.aktiv ? 'aria-current="page"' : ''}>${lp(x.id)}${esc(x.name)}<small>${T('offenN', { n: zaehle(x).offen })}</small></button>`).join('')
    + `<button class="tab plus" data-a="projekt-neu">${T('plusProjekt')}</button>`;
  $('#lauf').innerHTML = p ? laufHtml(p) : '';
  einstRender();
  if (!p) { $('#main').innerHTML = `<section class="hinweis"><h1>${T('keinProjektT')}</h1><p>${T('keinProjekt')}</p></section>`; return; }
  const z = zaehle(p);
  // Projektkopf: nur Name und Zähler in einer Zeile; Art und Beschreibung stehen in „Projekt bearbeiten“
  let h = `<section class="held"><h1>${esc(p.name)}</h1>
    <div class="kz">
      <button data-f="fabian" class="${S.filter === 'fabian' ? 'an' : ''}"><b>${z.fabian}</b><span>${esc(T('fuer', { wer: S.name }))}</span></button>
      <button data-f="claude" class="${S.filter === 'claude' ? 'an' : ''}"><b>${z.claude + z.wartet}</b><span>${esc(T('fuer', { wer: kiName() }))}</span></button>
    </div></section>`;
  h += postHtml(p);
  const sicht = (it) => S.filter === 'alle' || it.wer === S.filter;
  p.themen.forEach((t, i) => {
    const items = t.items.filter(sicht);
    const nr = String(i + 1).padStart(2, '0');
    // Link „Aufklappen“/„Zuklappen“ wie beim Archiv; standardmäßig offen, Zustand je Projekt im Browser. Umbenennen/Löschen nur in den Einstellungen
    const zu = !!S.themaZu[p.id]?.[t.id];
    h += `<section class="ab" data-thema="${t.id}"><div class="l"><span class="nr">${nr} —</span> ${esc(t.titel)}<span class="z">${T('offenN', { n: t.items.length })}</span>
      <span class="w"><button class="lk" data-a="thema-auf" aria-expanded="${!zu}">${zu ? T('aufklappen') : T('zuklappen')}</button></span></div><div>`
      + (zu ? '</div></section>' : (items.length ? items.map((it) => zeile(p, t, it)).join('') : `<p class="leer">${t.items.length ? T('nichtsImFilter') : T('keinePunkte')}</p>`)
      // Eingabe für neue Punkte erst nach Klick auf „+ Punkt“; Esc schließt sie wieder
      + (S.neuIn === t.id ? `<form class="neu" data-form="neu"><select name="typ" aria-label="${T('art')}"><option value="anweisung">${T('typAnweisung')}</option><option value="frage-an-claude">${esc(TYPEN()['frage-an-claude'])}</option><option value="idee">${T('typIdee')}</option><option value="aufgabe">${T('typAufgabeMich')}</option></select>
         <input name="titel" spellcheck="true" lang="${sprache()}" placeholder="${T('neuerPunkt')}" autocomplete="off" aria-label="${T('neuerPunktA')}"><button class="btn hell klein">${T('hinzufuegen')}</button></form>`
        : `<button class="plusp" data-a="punkt-neu">${T('plusPunkt')}</button>`) + '</div></section>');
  });
  // Ohne Themen: „+ Punkt“ legt beim Klick das Thema „Allgemein“ an
  if (!p.themen.length) h += `<section class="ab" data-thema="allgemein"><div class="l"><span class="nr">01 —</span> ${esc(T('allgemein'))}</div><div><p class="leer">${T('keinePunkte')}</p><button class="plusp" data-a="punkt-neu">${T('plusPunkt')}</button></div></section>`;
  h += archivHtml(p, String(Math.max(p.themen.length, 1) + 1).padStart(2, '0'));
  $('#main').innerHTML = h;
  const pf = $('#postText'); if (pf) { pf.value = entwurf(p.id); gr(pf); }
  document.querySelectorAll('textarea.kom').forEach(gr);
  S.markiert = null;
}
// Textfelder wachsen mit dem Text (Kommentare ab 34 px, „An Claude“ ab 56 px)
const gr = (t) => { t.style.height = 'auto'; t.style.height = Math.max(t.id === 'postText' ? 56 : 34, t.scrollHeight + 2) + 'px'; };

function zeile(p, t, it) {
  if (S.bearbeiten === it.id) return formular(it);
  const multi = it.mehrfach ? ' multi' : '';
  const opts = (it.optionen || []).length ? `<div class="opts">${it.optionen.map((o, i) => `<button class="opt${multi}${o.gewaehlt ? ' an' : ''}" data-opt="${i}" aria-pressed="${!!o.gewaehlt}"><i></i><span>${esc(o.t)}${o.empf ? `<em>${T('empfehlung')}</em>` : ''}</span></button>`).join('')}</div>` : '';
  // Infos (reine Antworten) bekommen statt des Links „Erledigt“ einen runden Kreis „OK“ wie die Optionen
  const info = it.typ === 'info';
  const ok = info ? `<div class="opts"><button class="opt" data-a="ja" aria-label="${esc(T('okArchivA', { titel: it.titel }))}"><i></i><span>OK</span></button></div>` : '';
  return `<article class="zeile${S.markiert === it.id ? ' neu-mark' : ''}" data-item="${it.id}">
    <div><h2>${esc(it.titel)}</h2>${it.text ? `<p class="tx">${esc(it.text)}</p>` : ''}${opts}${ok}
      <div class="akt">${info ? '' : `<button class="lk" data-a="ja" aria-label="${esc(T('erledigtA', { titel: it.titel }))}">${T('erledigt')}</button>`}${t.id === SPAETER ? `<button class="lk" data-a="zurueck">${T('zurueck')}</button>` : `<button class="lk" data-a="spaeter">${T('spaeter')}</button>`}<button class="lk" data-a="bearb">${T('bearbeiten')}</button><button class="lk" data-a="del">${T('loeschen')}</button></div></div>
    <div class="rechts"><textarea class="kom" spellcheck="true" lang="${sprache()}" rows="2" placeholder="${T('kommentar')}" aria-label="${esc(T('kommentarZu', { titel: it.titel }))}">${esc(it.kommentar || '')}</textarea></div></article>`;
}
function formular(it) {
  const opts = (it.optionen || []).map((o) => (o.empf ? '* ' : '') + o.t).join('\n');
  return `<form class="f" data-form="bearb" data-item="${it.id}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label>${T('art')}<select name="typ">${Object.entries(TYPEN()).map(([k, v]) => `<option value="${k}"${k === it.typ ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
    <label>${T('werIstDran')}<select name="wer"><option value="fabian"${it.wer !== 'claude' ? ' selected' : ''}>${esc(S.name)}</option><option value="claude"${it.wer === 'claude' ? ' selected' : ''}>${esc(kiName())}</option></select></label></div>
    <label>${T('titel')}<input name="titel" spellcheck="true" lang="${sprache()}" value="${esc(it.titel)}" required></label>
    <label>${T('text')}<textarea name="text" spellcheck="true" lang="${sprache()}" rows="2">${esc(it.text || '')}</textarea></label>
    <label>${T('optionenHilfe')}<textarea name="optionen" spellcheck="true" lang="${sprache()}" rows="3">${esc(opts)}</textarea></label>
    <div class="r"><label style="display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)"><input type="checkbox" name="mehrfach" style="width:auto"${it.mehrfach ? ' checked' : ''}> ${T('mehrfach')}</label>
      <span style="flex:1"></span><button type="button" class="btn hell" data-a="abbr">${T('abbrechen')}</button><button class="btn">${T('speichern')}</button></div></form>`;
}
// ---------- An Claude (Postfach je Projekt)

    <textarea id="postText" spellcheck="true" lang="${sprache()}" placeholder="${esc(T('nachrichtPlatzhalter', { ki: kiName(), name: p.name }))}" aria-label="${esc(T('nachrichtA', { ki: kiName() }))}"></textarea>

async function kopieren(p, text) {

  try { await navigator.clipboard.writeText(s); return true; } catch (e) { return false; }
}
async function senden() {

function archivHtml(p, nr) {
  const a = [...(p.archiv || []), ...(p.nachrichten || []).filter((x) => x.status === 'erledigt').map((m) => ({ ...m, _msg: true, erledigtAm: m.erstellt }))]
    .sort((x, y) => (y.erledigtAm || '').slice(0, 10).localeCompare((x.erledigtAm || '').slice(0, 10)));
  const inhalt = a.length ? a.map((x) => {

      <h3>${esc(x.titel)}</h3>${x.antwort ? `<div class="an">→ ${esc(x.antwort)}</div>` : ''}${x.kommentar ? `<div class="k">${esc(x.kommentar)}</div>` : ''}</div>
      <div class="b">${x.umgesetzt === false ? `<span class="badge w">${esc(T('wartetAuf', { ki: kiName() }))}</span>` : `<span class="badge">${T('umgesetzt')}</span>`}
        <span class="ak">${x.umgesetzt === false ? `<button class="btn hell klein" data-a="umg">${T('erledigt')}</button>` : ''}<button class="btn hell klein" data-a="zur">${T('zurueckInListe')}</button></span>
        <button class="lk adel" data-a="adel">${T('loeschen')}</button></div></div>`;

// ---------- Aktionen
function toast(text, rueck) {
  document.querySelector('.toast')?.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.innerHTML = `<span>${esc(text)}</span>`;
  if (rueck) { const b = document.createElement('button'); b.textContent = T('rueckgaengig'); b.onclick = () => { rueck(); d.remove(); }; d.append(b); }
  document.body.append(d); setTimeout(() => d.remove(), rueck ? 7000 : 4000);
}
function finde(el) {
  const p = S.projekte[S.aktiv]; const tEl = el.closest('[data-thema]'); const iEl = el.closest('[data-item]');
  let t = tEl && p.themen.find((x) => x.id === tEl.dataset.thema);
  let it = null; if (iEl) for (const tt of p.themen) { const f = tt.items.find((x) => x.id === iEl.dataset.item); if (f) { t = tt; it = f; } }
  return { p, t, it };
}
function bestaetigen(p, t, it) {
  const i = t.items.indexOf(it);
  const antwort = (it.optionen || []).filter((o) => o.gewaehlt).map((o) => o.t).join(' · ');
  const wartet = it.wer === 'fabian' && (it.typ === 'frage');
  const a = { ...it, themaId: t.id, themaTitel: t.titel, antwort, erledigtAm: heute(), umgesetzt: !wartet };
  t.items.splice(i, 1); const wieder = leerWeg(p, t); p.archiv.unshift(a); geaendert(p.id); render();
  toast(wartet ? T('entschieden', { titel: it.titel, ki: kiName() }) : T('insArchiv', { titel: it.titel }), () => { p.archiv = p.archiv.filter((x) => x.id !== it.id); wieder(); t.items.splice(i, 0, it); geaendert(p.id); render(); });
}
// Themen sind vorübergehend: leer gewordene Themen verschwinden, auch „Allgemein“; Rückgabe stellt sie wieder her
function leerWeg(p, t) {
  const i = p.themen.indexOf(t); if (i < 0 || t.items.length) return () => {};
  S.frisch.delete(p.id + '/' + t.id);
  p.themen.splice(i, 1);
  return () => { if (!p.themen.includes(t)) p.themen.splice(Math.min(i, p.themen.length), 0, t); };
}

// Später: Punkt ins Thema „Später“ (Claude überspringt es) bzw. zurück ins Herkunftsthema
function verschieben(p, t, it, spaeter) {
  const i = t.items.indexOf(it);
  let ziel;
  if (spaeter) {
    ziel = p.themen.find((x) => x.id === SPAETER); if (!ziel) { ziel = { id: SPAETER, titel: T('spaeter'), items: [] }; p.themen.push(ziel); }
    it.herkunft = { id: t.id, titel: t.titel };
  } else {
    const h = it.herkunft || { id: 'allgemein', titel: T('allgemein') };
    ziel = p.themen.find((x) => x.id === h.id); if (!ziel) { ziel = { id: h.id, titel: h.titel, items: [] }; p.themen.splice(Math.max(0, p.themen.findIndex((x) => x.id === SPAETER)), 0, ziel); }
    delete it.herkunft;
  }
  t.items.splice(i, 1); ziel.items.push(it); leerWeg(p, t); S.markiert = it.id; geaendert(p.id); render();
  toast(spaeter ? T('aufSpaeter', { titel: it.titel }) : T('zurueckIn', { titel: it.titel, ziel: ziel.titel }));
}

const seit = (ms) => { const m = Math.max(0, Math.floor((Date.now() - ms) / 60000)); const k = kiName(); return m < 1 ? T('gestartet', { ki: k }) : m < 60 ? T('seitMin', { ki: k, m }) : T('seitStd', { ki: k, h: Math.floor(m / 60), mm: String(m % 60).padStart(2, '0') }); };

// Zustand im Kopf zeigt nur der Knopf (grün bereit, orange pulsierend beim Lauf); daneben nur Fehler im letzten Lauf
function laufHtml(p) {
  const l = S.lauf[p.id] || {};
  const kein = !p.ordner;
  let text = '', titel = l.laeuft ? T('start', { zeit: uhr(l.start) }) : '';
  // Fehler im letzten Lauf: kurze Ursache in Alltagssprache (Server errät sie aus dem Protokoll), Erklärung im Tooltip
  if (!l.laeuft && l.ende && l.abgebrochen) { text = `<span>${T('lAbgebrochen')}</span>`; titel = T('lAbgebrochenT', { zeit: uhr(l.ende) }); }
  else if (!l.laeuft && l.ende && l.exit !== 0) { const g = l.grund || 'unbekannt'; text = '<span class="pt err" aria-hidden="true"></span><span class="err">' + T('grund_' + g) + '</span>'; titel = T('grund_' + g + 'T', { ki: kiName(p), zeit: uhr(l.ende), code: l.exit }); }
  const proto = l.ende || l.laeuft ? `<button class="lk" data-a="lauf-log">${T(l.laeuft ? 'lLive' : 'lProtokoll')}</button>` : '';
  const stopp = l.laeuft ? `<button class="lk" data-a="lauf-stopp">${T('lStopp')}</button>` : '';
  const zst = kein ? `<button class="lk ordnerlk" data-a="projekt-bearb" title="${esc(T('ordnerFehlt'))}">${T('ordnerWaehlen')}</button>`
    : (text ? `<span class="zst" title="${esc(titel)}">${text}</span>` : '') + stopp + proto;
  if (!S.ki) return `<div class="lauf"><button class="btn start" data-a="einrichtung">${T('kiEinrichten')}</button></div>`;
  // Umschalter zwischen den eingerichteten KIs, nur bei mehr als einer; gemerkt je Projekt
  // Logo der aktiven KI: im Umschalter oder (bei nur einer KI) allein daneben
  const logo = kiLogo(projektKi(p));
  const um = S.kis.length > 1 ? `<button class="btn hell kiwahl" data-a="ki-wechsel"${l.laeuft ? ' disabled' : ''} title="${esc(T('kiUmschalten'))}" aria-label="${esc(T('kiUmschaltenA', { ki: kiName(p) }))}">${logo}${esc(kiName(p))}<span class="pf" aria-hidden="true">⇄</span></button>`
    : logo ? `<span class="kiallein" title="${esc(projektKi(p)?.name || '')}">${logo}</span>` : '';
  return `<div class="lauf">${zst}${um}<button class="btn start${l.laeuft ? ' puls' : ''}" data-a="claude"${l.laeuft || kein ? ' disabled' : ''}${l.laeuft ? ` title="${esc(titel)}"` : ''}>${esc(T(l.laeuft ? 'kiArbeitet' : 'kiStarten', { ki: kiName() }))}</button></div>`;
}

// Läufe eines Projekts: Verlauf (Datum, KI, Dauer, Ergebnis) und das Protokoll des letzten Laufs
async function laufProtokoll(p) {
  if (!p) return;
  let j; try { j = await fetch('api/laeufe/' + p.id, { cache: 'no-store' }).then((r) => r.json()); } catch (e) { return toast(e.message); }
  const dauer = (v) => { const m = Math.max(0, Math.round((v.ende - v.start) / 60000)); return m < 60 ? T('lMin', { m: m || '< 1' }) : T('lStd', { h: Math.floor(m / 60), mm: String(m % 60).padStart(2, '0') }); };
  const erg = (v) => v.abgebrochen ? T('lAbgebrochen') : v.exit === 0 ? T('lOk') : T('grund_' + (v.grund || 'unbekannt'));
  const zeit = (ms) => { const d = new Date(ms); const tag = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); return `${datum(tag)} ${d.toTimeString().slice(0, 5)}`; };
  const l = S.lauf[p.id] || {};
  const zeilen = (l.laeuft ? `<tr><td>${zeit(l.start)}</td><td>${esc(l.ki || kiName(p))}</td><td>–</td><td class="an">${esc(T('kiArbeitet', { ki: kiName(p) }))}</td></tr>` : '')
    + (j.verlauf || []).map((v) => `<tr><td>${zeit(v.start)}</td><td>${esc(v.ki || '')}</td><td>${dauer(v)}</td><td${v.exit !== 0 && !v.abgebrochen ? ' class="err"' : ''}>${esc(erg(v))}</td></tr>`).join('');
  const d = $('#dlg');
  d.innerHTML = `<form class="f prot" method="dialog"><h2>${esc(T('lTitel', { name: p.name }))}</h2>
    ${zeilen ? `<table><thead><tr><th>${T('lWann')}</th><th>${T('ki')}</th><th>${T('lDauer')}</th><th>${T('lErgebnis')}</th></tr></thead><tbody>${zeilen}</tbody></table>` : `<p>${T('lKeine')}</p>`}
    ${j.fehler ? `<h3>${T('lFehlerausgabe')}</h3><pre>${esc(j.fehler)}</pre>` : ''}
    ${j.log ? `<h3>${T(l.laeuft ? 'lLaufend' : 'lLetztes')}</h3><pre>${esc(j.log)}</pre>` : ''}
    <div class="r"><button class="btn hell">${T('schliessen')}</button></div></form>`;
  d.showModal();
  d.querySelectorAll('pre').forEach((x) => { x.scrollTop = x.scrollHeight; });
}
// Suche über alle Projekte (Strg+K): Punkte, Kommentare, Nachrichten, Archiv; Treffer öffnet das Projekt und markiert den Eintrag
function suche() {
  const d = $('#dlg');
  d.innerHTML = `<form class="f suche" method="dialog"><input type="search" id="sFeld" placeholder="${esc(T('sucheText'))}" aria-label="${esc(T('suchen'))}" autocomplete="off"><div id="sTreffer" class="treffer" role="listbox"></div></form>`;
  const feld = $('#sFeld'); const box = $('#sTreffer');
  const zeig = () => {
    const q = feld.value.trim().toLowerCase();
    if (q.length < 2) { box.innerHTML = `<p class="leer">${T('sucheMin')}</p>`; return; }
    const tr = [];
    for (const p of liste()) {
      for (const t of p.themen || []) for (const it of t.items || []) if (it && [it.titel, it.text, it.kommentar].join(' ').toLowerCase().includes(q)) tr.push({ p, art: t.titel, titel: it.titel, ziel: { item: it.id, thema: t.id } });
      for (const n of p.nachrichten || []) if (n && [n.text, n.antwort].join(' ').toLowerCase().includes(q)) tr.push({ p, art: T('sNachricht'), titel: n.text, ziel: { msg: n.id } });
      for (const a of p.archiv || []) if (a && [a.titel, a.text, a.kommentar, a.ergebnis].join(' ').toLowerCase().includes(q)) tr.push({ p, art: T('sArchiv'), titel: a.titel, ziel: { arch: a.id } });
    }
    S.sTreffer = tr.slice(0, 40);
    box.innerHTML = S.sTreffer.length ? S.sTreffer.map((x, i) => `<button type="button" class="tr" data-s="${i}" role="option"><small>${esc(x.p.name)} · ${esc(x.art || '')}</small><span>${esc(String(x.titel || '').slice(0, 140))}</span></button>`).join('') : `<p class="leer">${T('sucheNichts')}</p>`;
  };
  feld.oninput = zeig;
  feld.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); box.querySelector('.tr')?.click(); } if (e.key === 'ArrowDown') { e.preventDefault(); box.querySelector('.tr')?.focus(); } };
  box.onkeydown = (e) => { const a = document.activeElement; if (e.key === 'ArrowDown') { e.preventDefault(); a.nextElementSibling?.focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); (a.previousElementSibling || feld).focus(); } };
  box.onclick = (e) => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    const x = S.sTreffer[+b.dataset.s]; d.close();
    S.aktiv = x.p.id; S.bearbeiten = null; S.filter = 'alle';
    if (x.ziel.thema && S.themaZu[x.p.id]) delete S.themaZu[x.p.id][x.ziel.thema];
    if (x.ziel.arch) S.archivAuf[x.p.id] = true;
    if (x.ziel.item) S.markiert = x.ziel.item;
    render();
    const el = document.querySelector(x.ziel.item ? `[data-item="${x.ziel.item}"]` : x.ziel.msg ? `[data-msg="${x.ziel.msg}"]` : `[data-arch="${x.ziel.arch}"]`);
    el?.scrollIntoView({ block: 'center' });
  };
  d.showModal(); zeig(); feld.focus();
}

async function kiListe(was, id) {

// Projekt löschen: nach Rückfrage verschiebt der Server die Dateien in den Backup-Ordner (daten/_backup/geloescht)
async function projektLoeschen(p) {
  if (!p || !confirm(T('loeschenFrage', { name: p.name }))) return;
  if (S.mtime[p.id] != null) {
    try {
      const r = await fetch('api/projekte/' + p.id, { method: 'DELETE' }); const j = await r.json();
      if (!r.ok) throw new Error(j.fehler || r.status);
    } catch (e) { toast(T('loeschenNicht', { fehler: e.message })); return; }
  }
  S.dirty.delete(p.id); delete S.projekte[p.id]; delete S.mtime[p.id]; delete S.auszulagern[p.id]; entwurf(p.id, '');
  if (S.aktiv === p.id) { S.aktiv = liste()[0]?.id || null; S.bearbeiten = null; }
  render(); toast(T('geloeschtBackup', { name: p.name }));
}

// Projektordner: Auswahl der Unterordner des Projekte-Ordners (api/ordner, einstellbar), voller Pfad als Ausnahme
async function ordnerFeld(akt) {
  const o = await fetch('api/ordner', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const bsp = (o ? o.basis : 'C:\\…\\Projekte') + '\\…';
  const pfad = (ein) => `<label id="dPfadL"${ein ? '' : ' hidden'}>${T('vollerPfad')}<input name="ordner" value="${esc(akt)}" placeholder="${esc(bsp)}"></label>`;
  if (!o) return `<label>${T('projektordner')}<input name="ordner" value="${esc(akt)}" placeholder="${esc(bsp)}"></label>`;
  const voll = (n) => o.basis + '\\' + n;
  const treffer = o.ordner.find((n) => voll(n).toLowerCase() === akt.toLowerCase());
  const anders = !!akt && !treffer;
  return `<label>${esc(T('projektordnerIn', { basis: o.basis.split('\\').pop() }))}<select name="wahl" id="dWahl"><option value="">${T('keinOrdner')}</option>
    ${o.ordner.map((n) => `<option value="${esc(voll(n))}"${n === treffer ? ' selected' : ''}>${esc(n)}</option>`).join('')}
    <option value="*"${anders ? ' selected' : ''}>${T('andererPfad')}</option></select></label>${pfad(anders)}`;
}
const ordnerAus = (fd) => { const w = fd.get('wahl'); return (w === null || w === '*' ? fd.get('ordner') || '' : w).trim().replace(/^"+|"+$/g, '').trim(); };

    d.close(); render();

// Installation im Hintergrund: Knopf aus, Fortschritt (Schritt, Zeit, letzte Ausgabezeile) bis zum Ende, dann neu prüfen
const ewZeit = (ms) => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
async function ewInstallieren(a, nurZeigen) {
  const d = $('#dlg'); const knopf = d.querySelector('[data-aktion="installieren"]'); const st = $('#eStand-installieren');
  if (!knopf || !st) return;
  knopf.disabled = true; d.querySelectorAll('[data-aktion]').forEach((b) => { b.disabled = true; });
  let j;
  try { j = await fetch(`api/anbieter/${a.id}/installieren`, { method: nurZeigen ? 'GET' : 'POST' }).then((x) => x.json()); }
  catch (e) { st.textContent = T('ewInstallFehler', { zeile: e.message }); knopf.disabled = false; return; }
  if (j.fehler) { st.textContent = j.fehler; knopf.disabled = false; return; }
  while (d.open && $('#eStand-installieren') === st) {
    if (!j.laeuft) {
      if (j.code === 0) { ewPruefen(); return; }
      st.classList.add('fehl'); st.textContent = T('ewInstallFehler', { zeile: j.zeile || String(j.code) });
      d.querySelectorAll('[data-aktion]').forEach((b) => { b.disabled = false; }); d.querySelector('details.selbst').open = true; return;
    }
    st.innerHTML = `${esc(T('ewInstalliert', { n: j.schritt, von: j.von, zeit: ewZeit(Date.now() - j.start) }))}<br><small>${esc(j.zeile || T('ewInstallHinweis'))}</small>`;
    await new Promise((ok) => setTimeout(ok, 1500));
    try { j = await fetch(`api/anbieter/${a.id}/installieren`, { cache: 'no-store' }).then((x) => x.json()); } catch (e) {}
  }
}
// Anmeldung: fabBoard öffnet ein Fenster mit dem Anmeldebefehl und prüft alle paar Sekunden, ob sie geklappt hat (bis 15 Minuten)
async function ewAnmelden(a) {
  const d = $('#dlg'); const knopf = d.querySelector('[data-aktion="anmelden"]'); const st = $('#eStand-anmelden');
  if (!knopf || !st) return;
  const x = await fetch(`api/anbieter/${a.id}/anmelden`, { method: 'POST' }).then((y) => y.json()).catch((e) => ({ fehler: e.message }));
  if (x.fehler) { st.classList.add('fehl'); st.textContent = x.fehler; return; }
  knopf.textContent = T('ewAnmeldenNochmal'); st.textContent = T('ewAnmeldenOffen');
  const ende = Date.now() + 15 * 60 * 1000;
  while (d.open && $('#eStand-anmelden') === st && Date.now() < ende) {
    await new Promise((ok) => setTimeout(ok, 4000));
    if (!d.open || $('#eStand-anmelden') !== st) return;
    try {
      const r = await fetch(`api/anbieter/${a.id}/pruefung?modell=${encodeURIComponent(EW.modell)}`, { cache: 'no-store' }).then((y) => y.json());
      if (r.schritte.every((s) => s.ok || s.aktion !== 'anmelden')) { ewPruefen(); return; }
    } catch (e) {}
  }
}

    <p>${T('erstKuerzel', { kuerzel: kuerzelText() })}</p>
    <div class="r"><button class="btn">${T('erstFertig')}</button></div>`);
  d.querySelector('form').onsubmit = (e) => { e.preventDefault(); erstEnde(); };
}
async function erstEnde() {
  const nachher = EW.nachher; EW.nachher = null; EW.erst = false;
  await fetch('api/eingerichtet', { method: 'POST' }).catch(() => {});
  const d = $('#dlg'); d.close();
  if (nachher === 'projekt') { await dialog(null); d.addEventListener('close', () => setTimeout(tour, 300), { once: true }); return; }
  setTimeout(tour, 300);
}
// Datenordner in den Einstellungen ändern (nur in der App): Ordner wählen, nachfragen, App startet neu
async function ordnerAendern() {
  if (!window.fabApp) return;
  const o = await fabApp.ordnerWaehlen(S.datenOrdner);
  if (!o || o === S.datenOrdner || !confirm(T('ordnerNeustartFrage', { ordner: o }))) return;
  if (S.dirty.size) await speichern();
  const x = await fetch('api/datenordner', { method: 'POST', body: JSON.stringify({ ordner: o }) }).then((y) => y.json()).catch((er) => ({ fehler: er.message }));
  if (x.fehler) return toast(x.fehler);
  if (x.neustart) fabApp.neuStarten();
}

// ---------- Kurze Tour: 4 Hinweise direkt im Board (Projekte, Nachricht an die KI, KI starten, Einstellungen); Esc oder „Überspringen“ beendet
function tour() {
  if ($('.tour')) return;
  const schritte = [['#tabs', 'tourProjekte'], ['#postText', 'tourNachricht'], ['[data-a="claude"]', 'tourStart'], ['#eKnopf', 'tourEinstellungen']]
    .filter(([sel]) => { const el = document.querySelector(sel); return el && el.getClientRects().length; });
  if (!schritte.length) return;
  let i = 0;
  const box = document.createElement('div'); box.className = 'tour';
  box.innerHTML = '<div class="tring"></div><div class="tkarte" role="dialog" aria-modal="true"></div>';
  document.body.append(box);
  const karte = box.querySelector('.tkarte'); const ring = box.querySelector('.tring');
  function zeigen() {
    const [sel, k] = schritte[i]; const el = document.querySelector(sel);
    if (!el) return weiter();
    el.scrollIntoView({ block: 'center' });
    const r = el.getBoundingClientRect(); const pad = 6;
    Object.assign(ring.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + 2 * pad + 'px', height: r.height + 2 * pad + 'px' });
    karte.innerHTML = `<div class="cap">${T('tourN', { n: i + 1, von: schritte.length })}</div><p>${esc(T(k, { ki: kiName(), kuerzel: kuerzelText(), kiKuerzel: kiKuerzelText() }))}</p>
      <div class="r"><button type="button" class="lk" data-t="ende">${T('tourUeberspringen')}</button><button type="button" class="btn klein" data-t="weiter">${T(i === schritte.length - 1 ? 'tourFertig' : 'weiter')}</button></div>`;
    // Karte unter dem Element, sonst darüber, immer im Fenster
    const kh = karte.offsetHeight; const kw = karte.offsetWidth;
    let top = r.bottom + 14; if (top + kh > innerHeight - 8) top = Math.max(8, r.top - kh - 14);
    Object.assign(karte.style, { top: top + 'px', left: Math.min(Math.max(8, r.left), innerWidth - kw - 8) + 'px' });
    karte.querySelector('[data-t="weiter"]').focus();
  }
  function ende() { box.remove(); removeEventListener('resize', zeigen); removeEventListener('keydown', taste, true); }
  function weiter() { i++; if (i < schritte.length) zeigen(); else ende(); }
  function taste(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ende(); } }
  box.addEventListener('click', (e) => { e.stopPropagation(); const b = e.target.closest('[data-t]'); if (b) (b.dataset.t === 'ende' ? ende : weiter)(); });
  addEventListener('resize', zeigen); addEventListener('keydown', taste, true);
  zeigen();
}

(async () => {
  try { const e = await fetch('api/einstellungen', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : {})).catch(() => ({})); if (e.name) S.name = e.name; S.ki = e.ki || null; S.kis = e.kis || []; S.datenOrdner = e.datenOrdner || ''; S.updatesAuto = e.updatesAuto === true; S.spenden = e.spenden || ''; S.sprachWahl = e.sprache || ''; setzeSprache(S.sprachWahl); if (e.version) $('#version').textContent = 'v' + e.version.split('.').slice(0, 2).join('.'); statisch();
    await laden(); render(); setInterval(abgleich, 4000); await laufStand(); setInterval(laufStand, 4000); window.addEventListener('focus', abgleich);
    // Erster Start: Ersteinrichtung; sonst Assistent, falls noch keine KI gewählt ist. Nicht im Netzwerk (dort ist die Einrichtung gesperrt)
    if (/^(localhost|127\.0\.0\.1)(:|$)/.test(location.host)) {
      if (!e.eingerichtet) ersteinrichtung();
      else { try { localStorage.removeItem(ERST_MERK); } catch (x) {} if (!S.ki) einrichtung(); }
    } }
  catch (e) { statisch(); $('#main').innerHTML = `<section class="hinweis"><h1>${T('nichtGestartetT')}</h1><p>${T('nichtGestartet')}</p></section>`; }
})();
// „↑“ erscheint, sobald der Projektbereich unter dem festen Kopf verschwunden ist
const hochPruefen = () => { const h = $('.held'); $('#hoch').hidden = !h || h.getBoundingClientRect().bottom > $('.oben').getBoundingClientRect().bottom; };
addEventListener('scroll', hochPruefen, { passive: true }); addEventListener('resize', hochPruefen);
window.addEventListener('beforeunload', (e) => { if (S.dirty.size) { speichern(); e.preventDefault(); e.returnValue = ''; } });
</script>
