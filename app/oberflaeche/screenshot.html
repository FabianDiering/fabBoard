<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>fabBoard – Screenshot</title>
<link href="schriften/schriften.css" rel="stylesheet">
<style>
/* Farben und Knöpfe wie im Board (index.html, Brandbook); Hell/Dunkel folgt der Wahl im Board */
:root{--bg:#FCFCFA;--ink:#1A1A1A;--muted:#6B6B66;--num:#66665F;--line:#E6E6E3;--field:#F4F4F1;--accent:#3E5C76;--mark:#E8EEF3;--onink:#FFFFFF;--hover:#333333;--err:#B3261E;--gruen:#2E8B57;--gruenF:#EAF4EE;--sans:Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--ink:#ECECE8;--muted:#9A9A94;--num:#8F8F89;--line:#2E3032;--field:#1F2123;--accent:#8FB0CC;--mark:#22313D;--onink:#141516;--hover:#D0D0CB;--err:#F2B8B5;--gruen:#5DBB85;--gruenF:#1C2A22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--ink:#ECECE8;--muted:#9A9A94;--num:#8F8F89;--line:#2E3032;--field:#1F2123;--accent:#8FB0CC;--mark:#22313D;--onink:#141516;--hover:#D0D0CB;--err:#F2B8B5;--gruen:#5DBB85;--gruenF:#1C2A22;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;padding:14px 29px 12px;font:14px/1.5 var(--sans)}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kopf{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.marke{font:900 26px/1 'Inter Tight',var(--sans);letter-spacing:-.03em}
.marke .pkt{color:#F07C1F;font-size:1.5em;line-height:0;letter-spacing:0}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cap b{font-weight:400;color:var(--num);margin-right:8px}
.werk{display:flex;align-items:center;gap:6px;margin:12px 0 8px}
.werk .zahl{margin-left:6px;color:var(--err);white-space:nowrap}
.werk .cap:last-child{margin-left:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:28px;padding:0 12px;border:0;border-radius:6px;background:var(--ink);color:var(--onink);font:500 13px var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.hell{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.hell:hover{background:var(--field)}
.btn.hell.an{background:var(--mark);color:var(--accent);border-color:var(--accent)}
.btn.start{background:transparent;color:var(--gruen);border:1.5px solid var(--gruen)}
.btn.start:hover{background:var(--gruenF)}
.btn:disabled{opacity:.5;cursor:default}
#flaeche{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;background:var(--field);border-radius:6px;overflow:hidden}
canvas{display:block;cursor:crosshair}
.leiste{display:grid;grid-template-columns:190px minmax(0,1fr) 128px;gap:0 14px;align-items:end;margin-top:12px}
.leiste label{display:flex;flex-direction:column;gap:4px}
select{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:5px 2px;border-radius:0;font-size:13px}
select:focus{outline:0;border-bottom:2px solid var(--accent)}
option{background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:96px;max-height:220px;resize:none;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--field);font-size:14px;line-height:1.45}
textarea:focus{outline:0;border-color:var(--accent)}
.knoepfe{display:flex;flex-direction:column;gap:6px}
.fuss{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
#fehler{color:var(--err);font-size:13px}
</style>
</head>
<body>
<header class="kopf"><span class="marke">fabBoard<span class="pkt">.</span></span><span class="cap" id="titel"></span></header>
<div class="werk">
  <button class="btn hell an" id="rechteck" type="button"></button>
  <button class="btn hell" id="pfeil" type="button"></button>
  <button class="btn hell" id="zurueck" type="button"></button>
  <span class="cap zahl" id="zahl"></span>
  <span class="cap" id="hilfe"></span>
</div>
<div id="flaeche"><canvas id="lw"></canvas></div>
<div class="leiste">
  <label><span class="cap"><b>01</b><span id="lProjekt"></span></span><select id="projekt"></select></label>
  <label><span class="cap"><b>02</b><span id="lKommentar"></span></span><textarea id="kommentar" spellcheck="true"></textarea></label>
  <div class="knoepfe">
    <button class="btn start" id="kiStart" type="button"></button>
    <button class="btn" id="senden" type="button"></button>
    <button class="btn hell" id="abbrechen" type="button"></button>
  </div>
</div>
<div class="fuss"><span id="fehler" role="alert"></span><span class="cap" id="kurz"></span></div>
<script src="texte.js"></script>
<script>
// Markier-Fenster: Ausschnitt mit roten Rechtecken und Pfeilen versehen, Projekt wählen, Kommentar, senden (optional mit KI-Start).
// Gespeichert wird über den Server (POST api/screenshot/<id>): Bild nach bilder\<projekt>\, Nachricht ins Projekt, Sicherung in _backup.
const $ = (s) => document.querySelector(s);
const ROT = '#FF1E1E';
const L = { bild: new Image(), formen: [], pfeil: false, zieht: null, s: 1 };
let ki = 'KI', laeuft = false;
try { const h = localStorage.getItem('fabboard-hell'); if (h === 'light' || h === 'dark') document.documentElement.dataset.theme = h; } catch (e) {}

// Strichstärke im Bild wie im alten Werkzeug: mit der Bildgröße wachsend, mindestens 3 Bildpunkte
const stift = () => Math.max(3, Math.round(Math.max(L.bild.width, L.bild.height) / 250));
function form(ctx, f, breite) {
  ctx.strokeStyle = ROT; ctx.fillStyle = ROT; ctx.lineWidth = breite; ctx.lineJoin = 'miter';
  if (!f.pfeil) { const x = Math.min(f.a.x, f.b.x), y = Math.min(f.a.y, f.b.y); ctx.strokeRect(x, y, Math.abs(f.a.x - f.b.x), Math.abs(f.a.y - f.b.y)); return; }
  // Pfeil: Linie bis zum Ansatz der Spitze, dann gefülltes Dreieck (Länge 4×, Breite 3,5× Strich)
  const dx = f.b.x - f.a.x, dy = f.b.y - f.a.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const sl = Math.min(len, breite * 4), sb = breite * 3.5 / 2;
  const bx = f.b.x - ux * sl, by = f.b.y - uy * sl;
  ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(f.a.x, f.a.y); ctx.lineTo(bx, by); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(f.b.x, f.b.y); ctx.lineTo(bx - uy * sb, by + ux * sb); ctx.lineTo(bx + uy * sb, by - ux * sb); ctx.closePath(); ctx.fill();
}
function zeichnen() {
  const c = $('#lw'), ctx = c.getContext('2d');
  ctx.drawImage(L.bild, 0, 0);
  for (const f of L.formen) form(ctx, f, stift());
  // beim Ziehen doppelt so kräftig, damit die Markierung gut zu sehen ist
  if (L.zieht) form(ctx, L.zieht, stift() * 2);
  $('#zahl').textContent = L.formen.length ? T('sMarkiert', { n: L.formen.length }) : '';
}
// Bild passt in die Fläche, höchstens 1:1 in Bildschirmpunkten (das Bild hat volle Auflösung, also durch devicePixelRatio)
function einpassen() {
  if (!L.bild.width) return;
  const f = $('#flaeche'), c = $('#lw');
  L.s = Math.min(f.clientWidth / L.bild.width, f.clientHeight / L.bild.height, 1 / (devicePixelRatio || 1));
  c.style.width = Math.round(L.bild.width * L.s) + 'px'; c.style.height = Math.round(L.bild.height * L.s) + 'px';
}
function punkt(e) {
  const r = $('#lw').getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * L.bild.width, y = (e.clientY - r.top) / r.height * L.bild.height;
  return { x: Math.max(0, Math.min(L.bild.width - 1, x)), y: Math.max(0, Math.min(L.bild.height - 1, y)) };
}
function werkzeug(pfeil) { L.pfeil = pfeil; $('#pfeil').classList.toggle('an', pfeil); $('#rechteck').classList.toggle('an', !pfeil); }
function zurueck() { if (L.formen.length) { L.formen.pop(); zeichnen(); } }

const lw = $('#lw');
lw.addEventListener('mousedown', (e) => {
  if (e.button === 2) { zurueck(); return; }
  if (e.button !== 0) return;
  const p = punkt(e); L.zieht = { pfeil: L.pfeil, a: p, b: p }; zeichnen();
});
addEventListener('mousemove', (e) => { if (L.zieht) { L.zieht.b = punkt(e); zeichnen(); } });
addEventListener('mouseup', (e) => {
  if (!L.zieht || e.button !== 0) return;
  const f = L.zieht; f.b = punkt(e); L.zieht = null;
  const w = Math.abs(f.a.x - f.b.x), h = Math.abs(f.a.y - f.b.y);
  if (f.pfeil ? w + h > 8 : w > 3 && h > 3) L.formen.push(f);
  zeichnen();
});
lw.addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('resize', einpassen);

// Kommentarfeld wächst mit dem Text (bis max-height, danach Scrollleiste); das Bild wird entsprechend kleiner
const kom = $('#kommentar');
kom.addEventListener('input', () => { kom.style.height = 'auto'; kom.style.height = Math.min(220, Math.max(96, kom.scrollHeight + 2)) + 'px'; einpassen(); });

addEventListener('keydown', (e) => {
  const imText = e.target === kom;
  if (e.key === 'Escape') { e.preventDefault(); fabShot.abbrechen(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); senden(e.shiftKey); return; }
  if (imText || e.target.tagName === 'SELECT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); zurueck(); return; }
  if (!e.ctrlKey && !e.metaKey && !e.altKey && (e.key === 'r' || e.key === 'R' || e.key === 'p' || e.key === 'P')) { e.preventDefault(); werkzeug(e.key.toLowerCase() === 'p'); }
});
$('#rechteck').onclick = () => werkzeug(false);
$('#pfeil').onclick = () => werkzeug(true);
$('#zurueck').onclick = zurueck;
$('#abbrechen').onclick = () => fabShot.abbrechen();
$('#senden').onclick = () => senden(false);
$('#kiStart').onclick = () => senden(true);

async function senden(kiStarten) {
  if (laeuft) return;
  const id = $('#projekt').value;
  if (!id) { $('#fehler').textContent = T('sKeineProjekte'); return; }
  laeuft = true; document.querySelectorAll('.knoepfe .btn').forEach((b) => { b.disabled = true; });
  $('#fehler').textContent = '';
  try {
    L.zieht = null; zeichnen();
    const bild = $('#lw').toDataURL('image/png');
    const x = await fetch('api/screenshot/' + encodeURIComponent(id), { method: 'POST', body: JSON.stringify({ bild, kommentar: kom.value, markiert: L.formen.length, kiStarten }) })
      .then((r) => r.json()).catch((er) => ({ fehler: er.message }));
    if (x.fehler) throw new Error(x.fehler);
    try { localStorage.setItem('fabboard-shot-projekt', id); } catch (e) {}
    const name = $('#projekt').selectedOptions[0]?.textContent || id;
    let info = T('sGesendet', { projekt: name });
    if (kiStarten) info = x.kiFehler ? T('sKiFehler', { ki, fehler: x.kiFehler }) : info + ' ' + T('sKiArbeitet', { ki });
    fabShot.fertig({ info, markiert: L.formen.length ? bild : '' });
  } catch (e) {
    $('#fehler').textContent = T('sFehler', { fehler: e.message });
    laeuft = false; document.querySelectorAll('.knoepfe .btn').forEach((b) => { b.disabled = false; });
  }
}

// Start: Sprache, KI-Name und Projekte vom Server, Bild aus der App; Vorauswahl = zuletzt gewähltes Projekt, sonst das im Board offene
async function start() {
  let s = {};
  try { s = await fetch('api/einstellungen', { cache: 'no-store' }).then((r) => r.json()); } catch (e) {}
  setzeSprache(s.sprache || ''); document.documentElement.lang = sprache();
  ki = s.ki?.kurz || T('ki');
  $('#titel').textContent = T('sTitel', { ki });
  $('#rechteck').textContent = T('sRechteck'); $('#pfeil').textContent = T('sPfeil'); $('#zurueck').textContent = T('rueckgaengig');
  $('#hilfe').textContent = T('sHilfe'); $('#lProjekt').textContent = T('projekt'); $('#lKommentar').textContent = T('sKommentar', { ki });
  $('#kiStart').textContent = T('sKiStarten', { ki }); $('#senden').textContent = T('sSenden'); $('#abbrechen').textContent = T('abbrechen');
  $('#kurz').textContent = T('sKurz', { ki });
  let projekte = [];
  try { projekte = (await fetch('api/alles', { cache: 'no-store' }).then((r) => r.json())).projekte || []; } catch (e) {}
  projekte.sort((a, b) => (Number(a.reihenfolge) || 0) - (Number(b.reihenfolge) || 0) || String(a.name).localeCompare(String(b.name)));
  const sel = $('#projekt');
  for (const p of projekte) sel.append(new Option(p.name || p.id, p.id));
  let vor = ''; try { vor = localStorage.getItem('fabboard-shot-projekt') || JSON.parse(localStorage.getItem('fabboard') || '{}').aktiv || ''; } catch (e) {}
  if (projekte.some((p) => p.id === vor)) sel.value = vor;
  if (!projekte.length) { $('#fehler').textContent = T('sKeineProjekte'); $('#senden').disabled = $('#kiStart').disabled = true; }
  const daten = window.fabShot ? await fabShot.bild() : null;
  if (daten) {
    await new Promise((ok) => { L.bild.onload = ok; L.bild.src = daten; });
    lw.width = L.bild.width; lw.height = L.bild.height;
    einpassen(); zeichnen();
  }
  kom.focus();
}
if (window.fabShot) start();
</script>
</body>
</html>
